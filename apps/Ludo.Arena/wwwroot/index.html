<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <meta name="description" content="Play Ludo against versioned C# bots. Safe stars, protected stacks, and everything on your device." />
 <meta name="theme-color" content="#173563" />
 <title>Ludo · Arena</title>
 <base href="/" />
 <link rel="preload" id="webassembly" />
 <link rel="stylesheet" href="css/app.css?v=effects-2" />
 <script type="importmap"></script>
</head>
<body>
 <div id="app"><main class="boot"><strong>LUDO / ARENA</strong><p>Preparing the board…</p><progress aria-label="Loading game"></progress></main></div>
 <div id="blazor-error-ui" role="alert">The game encountered a problem. <a href=".">Reload your saved game</a>.</div>
 <script>
  // GitHub Pages caches index.html and dotnet.js for ten minutes while every deployment renames the
  // fingerprinted framework files. A stale copy then asks for files that no longer exist and the loader
  // stops without a message. If the board has not appeared after a resource failure, a rejected start-up
  // or sixty seconds, refresh those two cached entry points and reload once per session.
  (function () {
   var key = 'arena-boot-retry', app = document.getElementById('app');
   function stalled() { return app && app.querySelector('main.boot'); }
   function recover(reason) {
    if (!stalled() || sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, reason);
    Promise.allSettled([fetch(location.href, { cache: 'reload' }), fetch('_framework/dotnet.js', { cache: 'reload' })])
     .then(function () { location.reload(); });
   }
   window.addEventListener('error', function (event) {
    var target = event.target;
    if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) recover('resource');
   }, true);
   window.addEventListener('unhandledrejection', function () { recover('start-up'); });
   setTimeout(function () { if (stalled()) recover('timeout'); else sessionStorage.removeItem(key); }, 60000);
  })();
 </script>
 <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
