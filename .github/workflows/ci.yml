name: Test and benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser build tools
        run: dotnet workload install wasm-tools
      - name: Verify package boundaries and frozen bot sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/verify-architecture.ps1 -BaseRef $env:BASE_SHA
      - run: dotnet build Ludo.sln -c Release
      - run: dotnet test Ludo.sln -c Release --no-build --logger trx
      - run: dotnet run --project tests/Ludo.Desktop.Smoke -c Release --no-build -- artifacts/warzone.png
      - name: Generate native replay fixture
        run: |
          dotnet apps/Ludo.Cli/bin/Release/net10.0/Ludo.Cli.dll match --bots v1,v2 --seed 12345 --out artifacts/match-native.json
          dotnet apps/Ludo.Cli/bin/Release/net10.0/Ludo.Cli.dll replay --file artifacts/match-native.json --state-out artifacts/native-final.json
          dotnet apps/Ludo.Cli/bin/Release/net10.0/Ludo.Cli.dll match --players 4 --bots v1,v2,v3,v4 --seed 45678 --out artifacts/match-four.json
          dotnet apps/Ludo.Cli/bin/Release/net10.0/Ludo.Cli.dll replay --file artifacts/match-four.json --state-out artifacts/four-final.json
      - run: dotnet publish apps/Ludo.Arena/Ludo.Arena.csproj -c Release -o artifacts/arena
      - run: ./scripts/prepare-pages.ps1 -BasePath /Ludo/
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright install chromium
      - name: Verify browser/native parity and static deployment
        run: |
          $server = Start-Process node -ArgumentList @('tests/browser/serve.mjs', 'artifacts/arena/wwwroot', '/Ludo/', '5252') -PassThru -WindowStyle Hidden
          try { npm test --prefix tests/browser; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - name: Bot regression gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/run-gate.ps1 -BaseRef $env:BASE_SHA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-and-benchmarks
          path: |
            artifacts/*.json
            artifacts/*.csv
            artifacts/*.png
            **/TestResults/*.trx
